name: CodSpeed Benchmarks

on:
  push:
    branches:
      - main
    paths:
      - "litellm/**"
      - "tests/benchmarks/**"
      - "litellm-rust/**"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/actions/cache-cargo-build/**"
      - ".github/scripts/uv_sync_with_retries.sh"
  pull_request:
    branches:
      - main
    paths:
      - "litellm/**"
      - "tests/benchmarks/**"
      - "litellm-rust/**"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/codspeed.yml"
      - ".github/actions/setup-uv-with-retries/**"
      - ".github/actions/cache-cargo-build/**"
      - ".github/scripts/uv_sync_with_retries.sh"
  # Allow CodSpeed to trigger backtest performance analysis
  # in order to generate initial data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Python benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC authentication with CodSpeed
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        uses: ./.github/actions/cache-cargo-build
        with:
          profile: release

      # Build the wheel and resolve every dependency outside the CodSpeed
      # runner: the same maturin build took 42 minutes inside `codspeed run`
      # versus under 3 minutes as a plain step (LIT-6183)
      - name: Build the release wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel into the benchmark environment
        run: |
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/benchmark-venv" .github/scripts/uv_sync_with_retries.sh --frozen --no-default-groups --group benchmarks --no-install-project --python 3.12
          uv pip install --python "${RUNNER_TEMP}/benchmark-venv/bin/python" --no-deps dist/*.whl

      - name: Collect benchmarks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          LITELLM_REQUIRE_INSTALLED_WHEEL: "1"
        run: >
          "${RUNNER_TEMP}/benchmark-venv/bin/python" -I -m pytest
          --import-mode=importlib
          -p pytest_codspeed.plugin
          tests/benchmarks/
          --codspeed
          --collect-only -q

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: >
            env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 LITELLM_REQUIRE_INSTALLED_WHEEL=1
            "${RUNNER_TEMP}/benchmark-venv/bin/python" -I -m pytest
            --import-mode=importlib
            -p pytest_codspeed.plugin
            tests/benchmarks/
            --codspeed

  rust-benchmarks:
    name: Rust benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC authentication with CodSpeed
    timeout-minutes: 45
    defaults:
      run:
        working-directory: litellm-rust

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update

      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-codspeed@4.6.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: litellm-rust
          key: codspeed
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The `codspeed` profile matches release optimizations but keeps symbols
      # so the CodSpeed flamegraphs stay readable.
      - name: Build the benchmarks
        run: >
          cargo codspeed build -m simulation --profile codspeed --locked
          -p litellm-cost -p litellm-python-compat -p litellm-token-counter
          --bench calculate --bench formats --bench token_counter

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          working-directory: litellm-rust
          run: cargo codspeed run
